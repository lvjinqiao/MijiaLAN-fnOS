[package]
name = "mijialan-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.10"
md5 = { package = "md-5", version = "0.10.6" }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"
serde.workspace = true
serde_json.workspace = true
directories = "6.0"
sys-locale = "0.3"
tempfile = "3.20"
if-addrs = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
