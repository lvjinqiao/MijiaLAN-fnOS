[workspace]
members = ["crates/core", "crates/homekit", "crates/cli", "crates/daemon"]
exclude = ["crates/desktop", "vendor/xattr", "vendor/gpui"]
default-members = ["crates/daemon"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["iPocket-APP"]

[workspace.dependencies]
mijialan-core = { path = "crates/core" }
mijialan-homekit = { path = "crates/homekit" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
